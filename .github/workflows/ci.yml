name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Check & Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet
        run: go tool mygo vet .
      - name: Check i18n
        run: go tool mygo i18n check .
      - name: Test
        env:
          CGO_ENABLED: "0"
        run: go test ./...
      - name: Check WASM build
        env:
          GOOS: js
          GOARCH: wasm
          CGO_ENABLED: "0"
        run: go build -o /dev/null ./cmd/lime

  test-macos:
    name: Test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        env:
          CGO_ENABLED: "0"
        run: go test ./...
