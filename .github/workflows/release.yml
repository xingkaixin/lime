name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  prepare:
    name: Verify Version & Draft Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check tag matches mygo.json version
        run: |
          version="$(jq -r .version mygo.json)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match mygo.json version v$version" >&2
            exit 1
          fi
      - name: Create draft release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi

  build-macos:
    name: Build macOS
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Configure signing keychain and notarization
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          MAC_CSC_NAME: ${{ secrets.MAC_CSC_NAME }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"

          python3 - "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/AuthKey.p8" <<'PY'
          import base64, os, re, sys

          def decode_b64(raw: str, name: str) -> bytes:
              s = raw.strip()
              if not s:
                  sys.exit(f"missing secret: {name}")
              if s.startswith("data:") and "," in s:
                  s = s.split(",", 1)[1]
              s = re.sub(r"\s+", "", s)
              pad = (-len(s)) % 4
              if pad:
                  s += "=" * pad
              try:
                  return base64.b64decode(s, validate=False)
              except Exception as e:
                  sys.exit(f"failed to base64-decode {name}: {e}")

          p12 = decode_b64(os.environ.get("MAC_CSC_LINK", ""), "MAC_CSC_LINK")
          with open(sys.argv[1], "wb") as f:
              f.write(p12)
          print(f"Decoded MAC_CSC_LINK ({len(p12)} bytes)")

          api_key_raw = os.environ.get("APPLE_API_KEY", "").strip()
          if not api_key_raw:
              sys.exit("missing secret: APPLE_API_KEY")
          if api_key_raw.startswith("-----BEGIN"):
              p8 = (api_key_raw + "\n").encode("utf-8")
              mode = "raw PEM"
          else:
              p8 = decode_b64(api_key_raw, "APPLE_API_KEY")
              mode = "base64"
          with open(sys.argv[2], "wb") as f:
              f.write(p8)
          print(f"Decoded APPLE_API_KEY ({len(p8)} bytes, {mode})")
          PY

          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -f pkcs12 -P "$MAC_CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/certificate.p12"

          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain

          identities="$(security find-identity -v -p codesigning "$keychain")"
          echo "$identities"
          signing_identity=""
          if [ -n "$MAC_CSC_NAME" ] && printf '%s\n' "$identities" | grep -Fq "\"$MAC_CSC_NAME\""; then
            signing_identity="$MAC_CSC_NAME"
          elif [ -n "$MAC_CSC_NAME" ] && printf '%s\n' "$identities" | grep -Fq "\"Developer ID Application: $MAC_CSC_NAME\""; then
            signing_identity="Developer ID Application: $MAC_CSC_NAME"
          else
            signing_identity="$(printf '%s\n' "$identities" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -n 1)"
          fi
          if [ -z "$signing_identity" ]; then
            echo "No Developer ID Application signing identity found in temporary keychain" >&2
            exit 1
          fi
          echo "Using signing identity: $signing_identity"
          echo "SIGNING_IDENTITY=$signing_identity" >> "$GITHUB_ENV"

          notary_args=(
            notarytool store-credentials notary
            --key "$RUNNER_TEMP/AuthKey.p8"
            --key-id "$APPLE_API_KEY_ID"
            --keychain "$keychain"
          )
          if [ -n "$APPLE_API_ISSUER" ]; then
            notary_args+=(--issuer "$APPLE_API_ISSUER")
          fi
          xcrun "${notary_args[@]}"
          rm -f "$RUNNER_TEMP/AuthKey.p8"

          echo "NOTARY_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Patch mygo.json for CI notarization
        run: |
          tmp="$(mktemp)"
          jq --arg kc "$NOTARY_KEYCHAIN" \
            '.macos.notarize = {"keychainProfile": "notary", "keychain": $kc}' \
            mygo.json > "$tmp"
          mv "$tmp" mygo.json
      - name: Build signed and notarized macOS releases
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          go tool mygo build -platform "darwin/arm64,darwin/amd64" -sign "$SIGNING_IDENTITY"
      - name: Repack DMGs with custom background (if present)
        run: |
          bg=""
          if [ -f "assets/dmg/background.tiff" ]; then
            bg="assets/dmg/background.tiff"
          elif [ -f "assets/dmg/background.png" ]; then
            bg="assets/dmg/background.png"
          fi
          if [ -z "$bg" ]; then
            echo "No custom DMG background at assets/dmg/background.{png,tiff}; keeping default DMGs."
            exit 0
          fi

          repacked=()
          for arch in arm64 amd64; do
            dir="build/darwin-${arch}"
            app="${dir}/Lime.app"
            dmg="$(find "$dir" -maxdepth 1 -name 'lime-*.dmg' -print -quit)"
            if [ -z "$dmg" ] || [ ! -d "$app" ]; then
              echo "Expected Lime.app and lime-*.dmg in $dir" >&2
              exit 1
            fi
            go run ./scripts/repack-dmg \
              -app "$app" \
              -out "$dmg" \
              -bg "$bg" \
              -volname "Lime"
            codesign --force --timestamp --sign "$SIGNING_IDENTITY" "$dmg"
            notary_out="$(xcrun notarytool submit "$dmg" \
              --keychain-profile notary \
              --keychain "$NOTARY_KEYCHAIN" \
              --wait \
              --output-format json)"
            echo "$notary_out"
            status="$(printf '%s' "$notary_out" | jq -r '.status // empty')"
            if [ "$status" != "Accepted" ]; then
              echo "DMG notarization failed with status: $status" >&2
              exit 1
            fi
            xcrun stapler staple "$dmg"
            repacked+=("$dmg")
          done
          go run ./scripts/repack-dmg -update-checksums build/SHA256SUMS "${repacked[@]}"
      - name: Upload macOS build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-macos
          if-no-files-found: error
          path: |
            build/darwin-*/*.dmg
            build/darwin-*/*.tar.gz
            build/darwin-*/*.delta
            build/darwin-*/install.sh
            build/darwin-*/update-*.json
            build/SHA256SUMS
      - name: Clean up temporary keychain
        if: always()
        run: |
          if [ -n "${NOTARY_KEYCHAIN:-}" ] && [ -f "$NOTARY_KEYCHAIN" ]; then
            security delete-keychain "$NOTARY_KEYCHAIN" || true
          fi

  build-windows:
    name: Build Windows
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Build Windows releases
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          go tool mygo build -platform "windows/amd64,windows/arm64"
      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          if-no-files-found: error
          path: |
            build/windows-*/*-setup-*.exe
            build/windows-*/*.tar.gz
            build/windows-*/*.delta
            build/windows-*/install.ps1
            build/windows-*/update-*.json
            build/SHA256SUMS

  upload-release:
    name: Upload to Draft Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: artifacts
      - name: Stage release assets and merge SHA256SUMS
        run: |
          mkdir -p stage/files stage/manifests

          python3 -c '
          import glob, re, sys
          sums = {}
          for path in sorted(glob.glob(sys.argv[1])):
              with open(path, encoding="utf-8") as f:
                  for line in f:
                      m = re.match(r"^([0-9a-f]{64}) [ *](.+)$", line.rstrip("\r\n"))
                      if m:
                          sums[m.group(2)] = m.group(1)
          if not sums:
              sys.exit("no checksums found in platform artifacts")
          with open(sys.argv[2], "w", encoding="utf-8") as out:
              for name in sorted(sums):
                  out.write(f"{sums[name]}  {name}\n")
          ' "artifacts/*/SHA256SUMS" "stage/files/SHA256SUMS"

          while IFS= read -r -d '' f; do
            base="$(basename "$f")"
            case "$base" in
              update-*.json)
                cp "$f" "stage/manifests/$base"
                ;;
              *.dmg|*-setup-*.exe|*.tar.gz|*.delta|install.sh|install.ps1)
                cp "$f" "stage/files/$base"
                ;;
            esac
          done < <(find artifacts -type f -print0)

          echo "=== Release files ==="
          ls -la stage/files
          echo "=== Update manifests ==="
          ls -la stage/manifests

          if [ -z "$(ls -A stage/files)" ] || [ -z "$(ls -A stage/manifests)" ]; then
            echo "Missing release files or update manifests" >&2
            exit 1
          fi
      - name: Upload installers, archives, scripts, and SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(stage/files/*)
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"
      - name: Upload update manifests last
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          manifests=(stage/manifests/*)
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "${manifests[@]}"
          echo "Draft release $GITHUB_REF_NAME updated. Review and publish with:"
          echo "  gh release edit $GITHUB_REF_NAME --repo $GITHUB_REPOSITORY --draft=false"
